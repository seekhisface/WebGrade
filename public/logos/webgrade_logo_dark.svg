<svg width="300" height="56" viewBox="0 0 300 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&amp;display=swap');
    </style>
    <linearGradient id="wBoxDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a4f7a"/>
      <stop offset="100%" style="stop-color:#1a3558"/>
    </linearGradient>
  </defs>

  <!-- W box -->
  <rect x="0" y="9" width="38" height="38" rx="5" fill="url(#wBoxDark)"/>
  <rect x="0" y="9" width="38" height="38" rx="5" fill="none" stroke="#4a9ebe" stroke-width="1.5"/>
  <line x1="0" y1="22" x2="14" y2="9"  stroke="#4a9ebe" stroke-width="0.7" opacity="0.22"/>
  <line x1="0" y1="34" x2="24" y2="9"  stroke="#4a9ebe" stroke-width="0.7" opacity="0.14"/>

  <!-- W centered -->
  <text x="19" y="40" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="800" fill="#edf4f9" text-anchor="middle">W</text>

  <!-- ebGrade -->
  <text x="32" y="40" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700" fill="#edf4f9">ebGrade</text>

  <!-- Divider + tagline -->
  <line x1="148" y1="16" x2="148" y2="40" stroke="#4a9ebe" stroke-width="1" opacity="0.35"/>
  <text x="156" y="23" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="500" fill="#4a9ebe" letter-spacing="0.3">Website Intelligence</text>
  <text x="156" y="42" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="400" fill="#7aaec8" letter-spacing="0.3">for Owners</text>
</svg>
